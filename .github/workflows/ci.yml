# みる陸 CI
# - シークレット不要（DB は各ジョブの service コンテナ。デプロイは手元から deploy/static/deploy.sh で行う）
# - Node.js は .nvmrc、pnpm は package.json の packageManager に従う
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Prisma CLI の更新確認・テレメトリを無効化
  CHECKPOINT_DISABLE: "1"

jobs:
  check:
    name: Lint / Typecheck / Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # version を指定しないと package.json の packageManager（pnpm@12.10.1）を使う
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db-test:
    name: DB integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: miruriku
          POSTGRES_PASSWORD: miruriku
          POSTGRES_DB: miruriku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miruriku -d miruriku_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # データベース名が _test で終わる場合のみテストが動く（test/db.ts）
      TEST_DATABASE_URL: postgresql://miruriku:miruriku@localhost:5432/miruriku_test?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # マイグレーションの適用は test/db-global-setup.ts が行う
      - run: pnpm test:db

  build:
    name: Static build (without database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'data/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # DATABASE_URL を設定せずに静的書き出しできること（公開データは data/real-events.ts）と、
      # 公開物に管理画面が含まれないことを確認する
      - name: pnpm build
        env:
          MIRURIKU_SITE_URL: https://miruriku.com
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then echo "DATABASE_URL must not be set during build" >&2; exit 1; fi
          pnpm build
          test -f out/index.html && test -f out/404.html
          if [ -e out/admin ] || [ -e out/api ]; then echo "admin pages must not be exported" >&2; exit 1; fi
          grep -q '<loc>https://miruriku.com/events/' out/sitemap.xml

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: miruriku
          POSTGRES_PASSWORD: miruriku
          POSTGRES_DB: miruriku_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miruriku -d miruriku_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # E2E 開始時に初期化される専用 DB（データベース名が _e2e で終わるもの）
      E2E_DATABASE_URL: postgresql://miruriku:miruriku@localhost:5432/miruriku_e2e?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

