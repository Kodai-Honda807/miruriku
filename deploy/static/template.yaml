AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  miruriku static hosting (private S3 bucket + CloudFront + ACM certificate).
  Managed by deploy/static/deploy.sh. DNS records are switched separately by deploy/static/switch-dns.sh.

# このテンプレートは deploy/static/deploy.sh が us-east-1 にデプロイする
# （CloudFront で使う ACM 証明書は us-east-1 にある必要があるため、スタック全体を us-east-1 に置く）。
# __VIEWER_REQUEST_JS__ の行は、deploy.sh が deploy/static/viewer-request.js の内容に置き換える。

Parameters:
  DomainName:
    Type: String
    Description: 公開ドメイン（例 miruriku.com）。www.<ドメイン> も証明書と CloudFront の別名に含める
    AllowedPattern: "^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: ドメインの公開ホストゾーン（証明書の DNS 検証レコードを自動で作る）
  ProjectTag:
    Type: String
    Default: miruriku

Resources:
  # 公開物（静的書き出し）を置くバケット。外部からは直接読めず、CloudFront（OAC）経由でだけ読める
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # 誤って上書き・削除した場合に戻せるよう、30 日間は以前の版を残す
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: managed-by
          Value: miruriku-static-deploy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: miruriku site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # HTTPS 証明書（無料）。HostedZoneId を指定すると、検証用の CNAME レコードを CloudFormation が作り、自動で更新される
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: project
          Value: !Ref ProjectTag

  # URL の書き換え・転送（/events/<slug>/ → index.html、末尾 / の付与、www → www なし）
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-viewer-request"
      AutoPublish: true
      FunctionConfig:
        Comment: miruriku URL rewrite and redirects (deploy/static/viewer-request.js)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        __VIEWER_REQUEST_JS__

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Same headers as the previous Caddy configuration
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        RemoveHeadersConfig:
          Items:
            - Header: Server

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "miruriku (${DomainName})"
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        # 北米・欧州・アジア（日本を含む）など。南米・オセアニアの一部のエッジを使わない分、料金の高い地域を避ける
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # マネージドポリシー CachingOptimized: クエリ・Cookie をキャッシュキーに含めない（?period=week なども同じ HTML）。
          # キャッシュの期間はアップロード時の Cache-Control に従う（deploy.sh）
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
        # 存在しないパス（S3 は 403 を返す）は 404.html を 404 で返す
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: project
          Value: !Ref ProjectTag

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
