# ローカル開発用の PostgreSQL。Web アプリはホスト側で `pnpm dev` で起動します。
name: miruriku

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: miruriku
      POSTGRES_PASSWORD: miruriku
      POSTGRES_DB: miruriku
    ports:
      # 既定は 127.0.0.1:5432。競合する場合は POSTGRES_PORT で変更してください。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 以降のイメージは /var/lib/postgresql 配下にデータを置きます。
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miruriku -d miruriku"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
